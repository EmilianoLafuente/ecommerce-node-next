<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ecommerce | Neumáticos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/frontend/shop/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1>🛞 Neumáticos Online</h1>
    <p>Calidad, seguridad y confort para tu auto</p>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- PRODUCTOS -->
    <section>
      <h2>Productos</h2>
      <div id="products" class="products-grid">
        <!-- Cards dinámicas -->
      </div>
    </section>

    <!-- CARRITO -->
    <aside class="cart">
      <h2>🛒 Carrito</h2>

      <ul id="cart" class="cart-list">
        <!-- Items -->
      </ul>

      <div class="cart-footer">
        <span>Total:</span>
        <strong>$<span id="total">0</span></strong>
      </div>

      <button class="btn-primary" onclick="confirmPurchase()">
        Confirmar compra
      </button>
    </aside>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Ecommerce Neumáticos — Proyecto educativo</p>
  </footer>

  <script src="/frontend/shop/scriptShop.js"></script>
</body>
</html>
